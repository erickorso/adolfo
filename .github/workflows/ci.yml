name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      SKIP_ENV_VALIDATION: "true"
      DATABASE_URL: "postgresql://adolfo:adolfo@localhost:5432/adolfo"
      AUTH_SECRET: "ci-test-secret-minimum-length-32-chars"
      EXCHANGE_RATE_TYPE: "tarjeta"
      AI_PROVIDER: "gemini"

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: adolfo
          POSTGRES_PASSWORD: adolfo
          POSTGRES_DB: adolfo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adolfo -d adolfo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npm run prisma:generate

      - run: npx prisma migrate deploy

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: validate
    env:
      SKIP_ENV_VALIDATION: "true"
      DATABASE_URL: "postgresql://adolfo:adolfo@localhost:5432/adolfo"
      AUTH_SECRET: "ci-test-secret-minimum-length-32-chars"
      EXCHANGE_RATE_TYPE: "tarjeta"
      AI_PROVIDER: "gemini"
      CI: "true"

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: adolfo
          POSTGRES_PASSWORD: adolfo
          POSTGRES_DB: adolfo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adolfo -d adolfo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npm run prisma:generate

      - run: npx prisma migrate deploy

      - run: npx playwright install chromium --with-deps

      - run: npm run build

      - run: npm run test:e2e
