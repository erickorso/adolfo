name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SKIP_ENV_VALIDATION: "true"
      DATABASE_URL: "postgresql://adolfo:adolfo@localhost:5432/adolfo"
      AUTH_SECRET: "ci-test-secret-minimum-length-32-chars"
      EXCHANGE_RATE_TYPE: "tarjeta"
      AI_PROVIDER: "gemini"

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: adolfo
          POSTGRES_PASSWORD: adolfo
          POSTGRES_DB: adolfo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adolfo -d adolfo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npm run prisma:generate

      - run: npx prisma migrate deploy

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

      - run: npm run build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 20
    env:
      SKIP_ENV_VALIDATION: "true"
      DATABASE_URL: "postgresql://adolfo:adolfo@localhost:5432/adolfo"
      AUTH_SECRET: "ci-test-secret-minimum-length-32-chars"
      EXCHANGE_RATE_TYPE: "tarjeta"
      AI_PROVIDER: "gemini"
      CI: "true"

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: adolfo
          POSTGRES_PASSWORD: adolfo
          POSTGRES_DB: adolfo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adolfo -d adolfo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npm run prisma:generate

      - run: npx prisma migrate deploy

      - run: npx playwright install chromium --with-deps

      - run: npm run build

      - run: npm run test:e2e

  deploy-production:
    name: deploy-production
    runs-on: ubuntu-latest
    needs: [validate, e2e]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.ENABLE_VERCEL_DEPLOY == 'true'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.preview-url }}
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Migrate production database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Deploy to Vercel (production)
        id: deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"
          github-token: ${{ secrets.GITHUB_TOKEN }}

  deploy-preview:
    name: deploy-preview
    runs-on: ubuntu-latest
    needs: [validate, e2e]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop' &&
      vars.ENABLE_VERCEL_DEPLOY == 'true'
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.preview-url }}
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Migrate preview database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Deploy to Vercel (preview)
        id: deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
